name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MediaGrab main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-Windows-v0.3.0
          path: dist/MediaGrab.exe
          retention-days: 30
      - name: Publish GitHub Release v0.3.0
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release 0.3.0]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v0.3.0" "dist/MediaGrab.exe#MediaGrab.exe" --target "${{ github.sha }}" --title "MediaGrab v0.3.0" --notes "MediaGrab for Windows. Downloads publicly accessible video, audio and images from web pages. Includes audio-only mode, multiple URL downloads, and Italian/English interface."
