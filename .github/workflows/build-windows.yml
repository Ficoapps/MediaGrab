name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MediaGrab main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-Windows-v0.3.0
          path: dist/MediaGrab.exe
          retention-days: 30
