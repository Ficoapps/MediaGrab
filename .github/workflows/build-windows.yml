name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q mediagrab
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MediaGrab main.py
      - name: Package browser extension
        shell: pwsh
        run: Compress-Archive -Path extension\* -DestinationPath dist\MediaGrab-Extension.zip -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-Windows
          path: |
            dist/MediaGrab.exe
            dist/MediaGrab-Extension.zip
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/__version__ = "\([^"]*\)"/\1/p' mediagrab/__init__.py)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: MediaGrab-Windows
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "v${VERSION}" \
            "release/MediaGrab.exe#MediaGrab.exe" \
            "release/MediaGrab-Extension.zip#MediaGrab-Extension.zip" \
            --target "${GITHUB_SHA}" \
            --title "MediaGrab v${VERSION}" \
            --notes "Security and reliability update: protected local connector, bounded download queue, safer URL handling, partial-download reporting, direct image URLs, temporary .part files, and matching browser extension."
